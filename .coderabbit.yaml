# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review settings. The CodeRabbit GitHub App must also be installed
# on the repository (https://github.com/apps/coderabbitai).

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!package-lock.json"
    - "!**/*.lock"
    - "!android/app/src/main/assets/**"
    - "!ios/App/App/public/**"
  path_instructions:
    - path: "src/**"
      instructions: >-
        Review against AGENTS.md and docs/specs/3-reference/coding-conventions.md:
        Vue 3 Composition API with `<script setup lang="ts">`, Ionic Vue
        components for UI, strict TypeScript (no `any`), strict comparisons,
        SPDX license header in new .ts files, tests next to the module as
        `*.test.ts`. Flag behaviour that is not described in the feature spec
        under docs/specs/4-architecture/features/.
    - path: "docs/specs/**"
      instructions: >-
        Specification-driven development (AGENTS.md): specs are the source of
        truth. Check that resolved open questions are folded into the spec's
        normative sections, IDs follow the FR/NFR/S/Q/T-<NNN>-<nn> scheme, and
        ADRs follow docs/specs/templates/adr-template.md.
    - path: "android/**"
      instructions: >-
        Generated by Capacitor (`npx cap add/sync`). Review only hand-made
        changes (Gradle signing/version wiring, manifest permissions, native
        plugins); never suggest committing keystores or credentials.
    - path: "ios/**"
      instructions: >-
        Generated by Capacitor. Review only hand-made changes (Info.plist usage
        strings, entitlements, native plugins); never suggest committing
        certificates or provisioning profiles.
    - path: ".github/workflows/**"
      instructions: >-
        Actions must be pinned to a full commit SHA with the version in a
        comment. Secrets must never be printed or passed to steps that do not
        need them, and release jobs must not run for pull requests.
    - path: "fastlane/**"
      instructions: >-
        Release lanes (ADR-0002). Secrets come only from environment
        variables; check that alpha and production lanes stay aligned.

chat:
  auto_reply: true
