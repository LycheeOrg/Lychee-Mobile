name: Release

# ADR-0002: every push to main ships an alpha (TestFlight, Google Play
# internal testing); publishing a GitHub release tagged vX.Y.Z ships to
# production (App Store review, Google Play production draft). Setup:
# docs/specs/5-operations/runbook-releases.md.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'release' && 'production' || 'alpha' }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.version.outputs.track }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out track and version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tags must look like v1.2.3, got '$TAG'"
              exit 1
            fi
            track=production
            version_name="${TAG#v}"
          else
            track=alpha
            version_name="$(node -p "require('./package.json').version")"
          fi
          {
            echo "track=$track"
            echo "version_name=$version_name"
            echo "build_number=$RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Track $track, version $version_name ($RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (${{ needs.meta.outputs.track }})
    needs: meta
    runs-on: ubuntu-latest
    environment: ${{ needs.meta.outputs.track }}
    env:
      CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
      VERSION_NAME: ${{ needs.meta.outputs.version_name }}
      VERSION_CODE: ${{ needs.meta.outputs.build_number }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip without store secrets
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Android release secrets are not set; skipping (see docs/specs/5-operations/runbook-releases.md)."

      - name: Checkout code
        if: env.CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        if: env.CONFIGURED == 'true'
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Set up JDK 21
        if: env.CONFIGURED == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: env.CONFIGURED == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Ruby
        if: env.CONFIGURED == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install, build and sync
        if: env.CONFIGURED == 'true'
        run: |
          vp install --frozen-lockfile
          vp run build
          npx cap sync android

      - name: Restore the upload keystore
        if: env.CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: fastlane android ${{ needs.meta.outputs.track }}
        if: env.CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android ${{ needs.meta.outputs.track }}

  ios:
    name: iOS (${{ needs.meta.outputs.track }})
    needs: meta
    runs-on: macos-latest
    environment: ${{ needs.meta.outputs.track }}
    env:
      CONFIGURED: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_URL != '' }}
      VERSION_NAME: ${{ needs.meta.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Skip without store secrets
        if: env.CONFIGURED != 'true'
        run: echo "::notice::iOS release secrets are not set; skipping (see docs/specs/5-operations/runbook-releases.md)."

      - name: Checkout code
        if: env.CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        if: env.CONFIGURED == 'true'
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Select Xcode
        if: env.CONFIGURED == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        if: env.CONFIGURED == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install, build and sync
        if: env.CONFIGURED == 'true'
        run: |
          vp install --frozen-lockfile
          vp run build
          npx cap sync ios

      - name: fastlane ios ${{ needs.meta.outputs.track }}
        if: env.CONFIGURED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios ${{ needs.meta.outputs.track }}
