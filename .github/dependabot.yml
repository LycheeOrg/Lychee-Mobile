version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vite-plus:
        patterns:
          - "vite"
          - "vite-plus"
      capacitor:
        patterns:
          - "@capacitor/*"
      ionic:
        patterns:
          - "@ionic/*"
          - "ionicons"
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Same as LycheeOrg/Lychee: vue-tsc and Vite+ are not on TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      fastlane:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns:
          - "*"
    ignore:
      # Gradle 9.6 removed an internal API that the Android Gradle Plugin 8.x
      # uses, and Capacitor 8's Android template is on AGP 8.13. Stay on the
      # Gradle 8.14 line (8.14.6+ carries the 2026-10 security fixes) until the
      # template moves to AGP 9.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.0.0"]
